<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main icon - Abstract blockchain/network symbol -->
  <g filter="url(#glow)">
    <!-- Central hexagon representing blockchain -->
    <polygon points="15,30 20,20 30,20 35,30 30,40 20,40" 
             fill="url(#iconGradient)" 
             stroke="url(#accentGradient)" 
             stroke-width="1.5"/>
    
    <!-- Connecting lines representing network -->
    <line x1="35" y1="30" x2="45" y2="25" 
          stroke="url(#accentGradient)" 
          stroke-width="2" 
          opacity="0.9"/>
    <line x1="35" y1="30" x2="45" y2="35" 
          stroke="url(#accentGradient)" 
          stroke-width="2" 
          opacity="0.9"/>
    <line x1="15" y1="30" x2="5" y2="25" 
          stroke="url(#accentGradient)" 
          stroke-width="2" 
          opacity="0.9"/>
    <line x1="15" y1="30" x2="5" y2="35" 
          stroke="url(#accentGradient)" 
          stroke-width="2" 
          opacity="0.9"/>
    
    <!-- Small nodes -->
    <circle cx="45" cy="25" r="3" fill="url(#accentGradient)" opacity="0.9"/>
    <circle cx="45" cy="35" r="3" fill="url(#accentGradient)" opacity="0.9"/>
    <circle cx="5" cy="25" r="3" fill="url(#accentGradient)" opacity="0.9"/>
    <circle cx="5" cy="35" r="3" fill="url(#accentGradient)" opacity="0.9"/>
    
    <!-- Ad symbol - megaphone -->
    <path d="M25 15 L35 15 L38 18 L38 22 L35 25 L25 25 L22 20 Z" 
          fill="url(#accentGradient)" 
          opacity="0.9"/>
    <circle cx="22" cy="20" r="1.5" fill="url(#accentGradient)" opacity="0.7"/>
  </g>
  
  <!-- Text "GalacticReachers" -->
  <text x="60" y="25" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        font-weight="bold" 
        fill="url(#accentGradient)">
    Galactic<tspan fill="url(#logoGradient)">Reachers</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="60" y="40" 
        font-family="Arial, sans-serif" 
        font-size="10" 
        fill="url(#accentGradient)" 
        opacity="0.8">
    Web3 Advertising Platform
  </text>
</svg>
